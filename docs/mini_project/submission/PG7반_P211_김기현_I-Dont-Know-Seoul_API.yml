openapi: 3.0.3
info:
  title: I Don't Know Seoul API
  version: "1.0.0"
  description: |
    목적지만 입력하면 수도권 행정동을 비교하고 실거주 후기를 확인할 수 있는
    I Don't Know Seoul의 HTTP API 설계다.

    데이터 경계:
    - Cloudflare KV: 지도·추천·상세·통근 계산에 사용하는 `bundle:current` 데이터
      번들(행정동 경계, 지표, 점수, 지하철·버스 그래프)과 일반 지오코딩 결과 캐시.
    - Cloudflare D1: `regions`, `users`, `oauth_accounts`, `sessions`,
      `destinations`, `reviews`, `review_helpfuls` 7개 테이블만 영속 저장한다.
    - 브라우저: 통근시간, 등급, 추천 정렬, 상세 계산, 경로 표시, 공유 URL 상태를
      `/api/data` 응답으로 계산한다. 별도 추천·통근·상세 계산 API는 제공하지 않는다.

    인증은 `cookieAuth` HttpOnly 세션 쿠키를 사용한다. 이메일·실명·프로필 사진,
    OAuth access/refresh token, 원문 세션 토큰은 JSON 응답이나 D1에 저장하지 않는다.
    OAuth 제공자는 최종 문서 기준 `kakao`와 `github`만 허용한다.
    OAuth·후기·도움돼요 경로는 제출을 위한 API 설계 계약이며, 현재 Worker에 구현
    완료되었거나 운영 배포되었다고 주장하지 않는다.
servers:
  - url: http://localhost:8787
    description: Local Worker (운영 URL은 확정하지 않음)
tags:
  - name: data
    description: KV 데이터 번들
  - name: geocode
    description: KV 캐시를 사용하는 목적지 지오코딩 프록시
  - name: auth
    description: Kakao·GitHub OAuth와 HttpOnly 세션
  - name: reviews
    description: 행정동 실거주 후기와 도움돼요

paths:
  /api/data:
    get:
      tags: [data]
      summary: 지도 데이터 번들 조회
      operationId: getDataBundle
      description: |
        브라우저가 최초 진입 때 한 번 호출하는 공개 데이터 번들이다. Worker는
        `GET`만 허용하고, 먼저 KV의 `bundle:current`를 스트림으로 반환한다. KV가
        비어 있으면 `/data/bundle.json` 정적 자산으로 폴백한다. 응답을 받은 뒤
        통근시간·등급·추천·상세·교통 경로와 공유 URL은 브라우저가 계산하므로
        서버 계산 결과를 요청하는 API가 아니다.

        KV와 정적 자산이 모두 실패하면 현재 구현은 503을 반환하고, KV/Asset
        접근 중 예외가 전파되면 Worker 공통 catch가 500을 반환한다. 비 GET은
        405와 `Allow: GET`을 반환한다. 목적지 없이 진입한 화면은 이 응답의
        성공 여부와 무관하게 UI 빈 상태를 표시할 수 있다.

        - 요구사항: `REQ-FUNC-003`, `REQ-FUNC-004`, `REQ-FUNC-005`, `REQ-FUNC-006`,
          `REQ-FUNC-007`, `REQ-FUNC-008`, `REQ-FUNC-009`, `REQ-FUNC-010`,
          `REQ-NFN-001`, `REQ-NFN-002`, `REQ-NFN-006`
        - 화면: `SCR-MAIN-001`, `SCR-WGHT-001`, `SCR-DONG-001`
        - 저장소/테이블: Cloudflare KV `bundle:current` 또는 정적 Asset
          `/data/bundle.json`; D1 테이블 없음

        `REQ-NFN-002`의 1초 목표는 이 API가 통근시간을 계산하거나 1초 안에
        계산 결과를 반환한다는 뜻이 아니다. 이 응답이 완료된 뒤 목적지·조건 변경에
        따른 행정동별 통근 계산과 추천 재정렬을 브라우저가 로컬 데이터로 1초 이내
        수행해야 한다는 성능 요구다.
      responses:
        '200':
          description: KV 또는 정적 Asset에서 데이터 번들을 반환
          headers:
            Cache-Control:
              description: 브라우저가 번들을 캐시하는 최대 시간
              schema:
                type: string
              example: public, max-age=3600
            X-Oneday-Source:
              description: 실제 응답 원천
              schema:
                type: string
                enum: [kv, assets]
              example: kv
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataBundle'
              example:
                meta:
                  boundaryVersion: "20260701"
                  scoreVersion: "2026-08-18"
                pctKeys: [storePerKm2, foodPerKm2, medicalPerKm2]
                axisWeights:
                  safety: {key: crimePer1k}
                  price: {key: monthlyRentMan}
                  convenience: {key: storePerKm2}
                unavailableAxes: []
                dongs:
                  - code: "1111053000"
                    name: 종로구 사직동
                    dong: 사직동
                    gu: 종로구
                    guCode: "11110"
                    areaKm2: 1.1649
                    lng: 126.970011
                    lat: 37.573854
                graph: {version: "2026-08-15", stations: [], nodes: [], edges: []}
                bus: {version: "2026-08-12", stops: [], routes: []}
                residential: {version: "sgis-2024-100m-bus-v4", byDong: {}}
                scores: {}
        '405':
          $ref: '#/components/responses/WorkerMethodNotAllowed'
        '503':
          $ref: '#/components/responses/WorkerServiceUnavailable'
        '500':
          $ref: '#/components/responses/WorkerServerError'

  /api/geocode:
    get:
      tags: [geocode]
      summary: 목적지 주소·장소명 검색
      operationId: geocodeDestination
      description: |
        주소 또는 장소명으로 목적지 후보를 검색하는 얇은 서버 프록시다. `q`는
        클라이언트 계약상 공백을 제거한 2~100자이며, Worker는 Kakao 결과를
        우선 사용하고 결과가 없거나 키가 없으면 KV 번들의 지하철역으로 폴백한다.
        성공 결과가 있을 때만 일반 지오코딩 결과를 KV `geo:v2:<q>`에 30일 캐시한다.
        목적지 검색 결과를 D1 `destinations`에 저장하지 않으며, 후기 저장 시
        전달된 목적지 스냅샷만 후기 API의 트랜잭션으로 D1에 저장한다.

        현재 Worker는 q가 없거나 2자 미만·100자 초과여도 400으로 바꾸지 않고
        `200 {"results": []}`를 반환한다. 검색 결과 0건을 404로 표시한
        `SCR-HOME-001` 화면 문서와의 차이는 실제 응답을 바꾸지 않고, 브라우저가
        빈 배열을 “검색 결과 없음” UI 상태로 처리하도록 한다. 비 GET은 405와
        `Allow: GET`, 처리 중 예외는 500을 반환한다.

        - 요구사항: `REQ-FUNC-002`, `REQ-FUNC-013`, `REQ-NFN-003`
        - 화면: `SCR-HOME-001`, `SCR-MAIN-001`, `SCR-WGHT-001`, `SCR-RVW-002`
        - 저장소/테이블: Cloudflare KV `geo:v2:<q>`와 `bundle:current` 또는
          정적 Asset의 역 목록; D1 테이블 없음(후기 목적지는 후기 POST에서만 저장)
      parameters:
        - name: q
          in: query
          required: true
          description: 공백 제거 후 검색할 주소·장소명. 2~100자. 범위를 벗어나도 현재 구현은 200 빈 배열을 반환한다.
          schema:
            type: string
            minLength: 2
            maxLength: 100
          example: 강남역
      responses:
        '200':
          description: 검색 결과 또는 결과가 없는 빈 배열
          headers:
            X-Oneday-Geocode:
              description: 결과 원천. q가 무효하여 빈 배열을 반환한 경우 헤더가 없을 수 있다.
              schema:
                type: string
                enum: [kv-hit, kakao, kakao-empty-station, station]
              example: kakao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoResponse'
              examples:
                found:
                  summary: 장소 검색 성공
                  value:
                    results:
                      - name: 강남역
                        address: 서울 강남구 강남대로 396
                        lat: 37.497942
                        lng: 127.027621
                        kind: station
                empty:
                  summary: 검색 결과 없음 또는 q 범위 오류의 현재 Worker 응답
                  value:
                    results: []
        '405':
          $ref: '#/components/responses/WorkerMethodNotAllowed'
        '500':
          $ref: '#/components/responses/WorkerServerError'

  /api/auth/{provider}:
    get:
      tags: [auth]
      summary: OAuth 로그인 시작
      operationId: startOAuth
      description: |
        `kakao` 또는 `github` 인가 화면으로 브라우저를 302 리다이렉트한다.
        access token이나 refresh token을 브라우저에 반환하지 않는다. 제공자 외부
        인가가 끝나면 지정된 callback으로 돌아오며 세션 발급은 callback에서 수행한다.

        - 요구사항: `REQ-FUNC-011`, `REQ-NFN-003`, `REQ-NFN-004`
        - 화면: `SCR-AUTH-001`
        - 저장소/테이블: 외부 OAuth 제공자; D1 `users`, `oauth_accounts`,
          `sessions`는 callback 이후 사용(시작 단계의 영속 저장 없음)
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '302':
          description: 제공자 인가 화면으로 브라우저 리다이렉트
          headers:
            Location:
              description: 서버 설정으로 결정된 Kakao 또는 GitHub 인가 URL
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/{provider}/callback:
    get:
      tags: [auth]
      summary: OAuth callback 처리 및 세션 발급
      operationId: oauthCallback
      description: |
        OAuth 제공자가 돌려준 `code`와 CSRF 방지용 `state`를 서버에서 검증하고,
        제공자별 식별자와 익명 닉네임으로 `users`·`oauth_accounts`를 생성하거나
        조회한다. 이어서 원문 세션 토큰의 해시만 D1 `sessions`에 저장하고,
        브라우저에는 HttpOnly 세션 쿠키만 설정한 뒤 로그인 시작 직전의 화면으로
        복귀하도록 앱 경로에 리다이렉트한다. 따라서 성공 응답은 사용자 JSON을
        반환하는 200이 아니라 `Location`과 `Set-Cookie`를 포함한 302다.
        응답 JSON에 사용자 이메일·실명·사진·OAuth 토큰·원문 세션 토큰은 넣지 않는다.

        - 요구사항: `REQ-FUNC-011`, `REQ-NFN-003`, `REQ-NFN-004`
        - 화면: `SCR-AUTH-001`
        - 저장소/테이블: D1 `users`, `oauth_accounts`, `sessions`; 외부 OAuth
          제공자 토큰은 서버 처리 중에만 사용하고 영속 저장하지 않음
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: code
          in: query
          required: true
          description: 제공자가 발급한 일회성 인가 코드
          schema:
            type: string
          example: authorization-code
        - name: state
          in: query
          required: true
          description: 시작 요청과 callback을 연결하는 CSRF 검증 값
          schema:
            type: string
          example: state-value
        - name: error
          in: query
          required: false
          description: 사용자가 제공자 인가를 거부했을 때 제공자가 보내는 오류 값
          schema:
            type: string
      responses:
        '302':
          description: 세션 쿠키를 설정하고 OAuth 로그인 시작 직전 화면을 복원하는 앱 경로로 리다이렉트
          headers:
            Location:
              description: 로그인 시작 전에 저장한 직전 화면·동작으로 돌아갈 앱 경로
              schema:
                type: string
                format: uri-reference
              example: /
            Set-Cookie:
              description: 원문 토큰을 JSON으로 반환하지 않고 HttpOnly 쿠키로만 전달한다. 서버 D1에는 해시만 저장한다.
              schema:
                type: string
              example: oneday_session=<opaque>; Path=/; HttpOnly; Secure; SameSite=Lax
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 제공자 신원 또는 state 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: OAUTH_VERIFICATION_FAILED
                message: 로그인 정보를 확인하지 못했습니다.
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/me:
    get:
      tags: [auth]
      summary: 현재 로그인 사용자 조회
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      description: |
        HttpOnly 세션 쿠키를 검증해 후기 화면에 필요한 최소 사용자 정보만 반환한다.
        이메일·실명·사진·OAuth 토큰과 원문 세션 토큰은 반환하지 않는다. 로그아웃
        뒤에도 브라우저의 지도·추천·후기 조회 기능은 계속 사용할 수 있다.

        - 요구사항: `REQ-FUNC-011`, `REQ-NFN-003`, `REQ-NFN-004`
        - 화면: `SCR-AUTH-001`, `SCR-RVW-001`, `SCR-RVW-002`
        - 저장소/테이블: D1 `sessions`, `users`
      responses:
        '200':
          description: 로그인 사용자 최소 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
              example:
                id: 42
                nickname: 익명_7F3A
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃
      operationId: logout
      security:
        - cookieAuth: []
      description: |
        현재 HttpOnly 세션을 폐기하고 만료된 쿠키를 내려준다. 탐색·데이터·공개
        후기 조회는 로그아웃 후에도 사용할 수 있다.

        - 요구사항: `REQ-FUNC-011`, `REQ-NFN-003`
        - 화면: `SCR-AUTH-001`
        - 저장소/테이블: D1 `sessions`
      responses:
        '204':
          description: 세션 폐기 및 쿠키 만료 완료
          headers:
            Set-Cookie:
              description: 같은 HttpOnly 세션 쿠키를 즉시 만료한다.
              schema:
                type: string
              example: oneday_session=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/regions/{code}/reviews:
    get:
      tags: [reviews]
      summary: 행정동 후기 목록 조회
      operationId: listRegionReviews
      security:
        - {}
        - cookieAuth: []
      description: |
        비로그인 공개 후기 목록이다. 기본 `relevant` 정렬은 브라우저가 가진 현재
        목적지의 `lat`·`lng`를 query로 받아 후기 목적지와의 거리가 가까운 순으로
        정렬한다. 현재 브라우저 목적지는 D1에 저장된 행이 아니므로 D1
        `destinationId`가 아니라 `lat`와 `lng` query를 사용한다. `sort=relevant`일
        때는 두 좌표를 함께 보내야 하며 하나라도 없으면 400이다. `latest`와
        `helpful`은 좌표를 생략할 수 있다. 로그인 쿠키가 있으면 각 카드에
        `helpfulByMe`와 `isMine`을 채우고, 없으면 둘 다 false로 반환한다.
        `helpfulCount`는 `review_helpfuls` COUNT, `helpfulByMe`는 현재 세션 사용자와
        `review_helpfuls`의 존재 여부, `isMine`은 현재 세션 사용자와
        `reviews.user_id`의 일치 여부로 계산하는 응답값이다.

        - 요구사항: `REQ-FUNC-012`, `REQ-FUNC-015`
        - 화면: `SCR-RVW-001`
        - 저장소/테이블: D1 `regions`, `reviews`, `users`, `destinations`,
          `review_helpfuls`, 선택적 `sessions`
      parameters:
        - $ref: '#/components/parameters/RegionCode'
        - name: sort
          in: query
          required: false
          description: 목적지 관련순, 최신순, 도움돼요순
          schema:
            type: string
            enum: [relevant, latest, helpful]
            default: relevant
          example: relevant
        - name: lat
          in: query
          required: false
          description: 현재 브라우저 목적지 위도. sort=relevant일 때 lng와 함께 필요하다.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 37.497942
        - name: lng
          in: query
          required: false
          description: 현재 브라우저 목적지 경도. sort=relevant일 때 lat와 함께 필요하다.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 127.027621
        - name: page
          in: query
          required: false
          description: 1부터 시작하는 페이지 번호
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: pageSize
          in: query
          required: false
          description: 페이지당 후기 수
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          example: 20
      responses:
        '200':
          description: 공개 후기 페이지. 후기가 없으면 items가 빈 배열이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
              example:
                page: 1
                pageSize: 20
                totalCount: 1
                hasNext: false
                items:
                  - id: 101
                    nickname: 익명_7F3A
                    residenceMonths: 18
                    destination:
                      name: 강남역
                      address: 서울 강남구 강남대로 396
                      lat: 37.497942
                      lng: 127.027621
                    feltCommuteMin: 42
                    ratings:
                      safety: 4
                      price: 3
                      convenience: 5
                    body: 밤에도 골목이 밝고 출퇴근 동선이 단순해서 만족했습니다.
                    helpfulCount: 7
                    helpfulByMe: false
                    isMine: false
                    createdAt: "2026-09-16T09:00:00Z"
                    updatedAt: "2026-09-16T09:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [reviews]
      summary: 행정동 후기 작성
      operationId: createRegionReview
      security:
        - cookieAuth: []
      description: |
        로그인한 회원만 작성한다. `destination`은 반드시 존재하고 null일 수 없으며,
        `destinationId` 대신 화면에서 선택한 `name`, `address`, `lat`, `lng` 객체를
        받는다. POST마다 해당 후기 전용 목적지 snapshot 행을 새로 만들고 `reviews`
        행과 함께 하나의 D1 트랜잭션으로 저장한다. 목적지 snapshot은 다른 후기와
        공유하지 않으며 공유 행을 직접 수정하지 않는다. 같은 사용자와 행정동
        조합은 `UNIQUE(user_id, region_code)`로 한 건만 허용하므로 두 번째 작성은
        409이다. API의 `destination.name`은 D1 `destinations.place_name`으로
        매핑한다.

        거주 기간은 1~600개월, 체감 통근시간은 0~240분 또는 null, 세 평점은
        모두 1~5, 본문은 20~1000자다. 후기에 저장하는 목적지는 일반 지오코딩
        캐시와 별개이며, 서버가 통근시간·점수·추천을 계산하지 않는다. API
        camelCase 필드는 D1 snake_case 컬럼으로 변환한다(`residenceMonths`↔
        `reviews.residence_months`, `feltCommuteMin`↔`reviews.felt_commute_min`,
        `ratings.safety|price|convenience`↔`reviews.rating_safety|rating_price|rating_convenience`).

        - 요구사항: `REQ-FUNC-013`, `REQ-NFN-003`
        - 화면: `SCR-RVW-002`
        - 저장소/테이블: D1 `sessions`, `users`, `regions`, `destinations`,
          `reviews`; 트랜잭션 저장
      parameters:
        - $ref: '#/components/parameters/RegionCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
            example:
              residenceMonths: 18
              destination:
                name: 강남역
                address: 서울 강남구 강남대로 396
                lat: 37.497942
                lng: 127.027621
              feltCommuteMin: 42
              ratings:
                safety: 4
                price: 3
                convenience: 5
              body: 밤에도 골목이 밝고 출퇴근 동선이 단순해서 만족했습니다.
      responses:
        '201':
          description: 후기와 목적지 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
              example:
                id: 101
                nickname: 익명_7F3A
                residenceMonths: 18
                destination:
                  name: 강남역
                  address: 서울 강남구 강남대로 396
                  lat: 37.497942
                  lng: 127.027621
                feltCommuteMin: 42
                ratings: {safety: 4, price: 3, convenience: 5}
                body: 밤에도 골목이 밝고 출퇴근 동선이 단순해서 만족했습니다.
                helpfulCount: 0
                helpfulByMe: false
                isMine: true
                createdAt: "2026-09-16T09:00:00Z"
                updatedAt: "2026-09-16T09:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/reviews/{reviewId}:
    patch:
      tags: [reviews]
      summary: 본인 후기 수정
      operationId: updateReview
      security:
        - cookieAuth: []
      description: |
        세션 사용자와 후기의 `user_id`가 일치할 때만 전달된 필드를 수정한다.
        `ReviewUpdate`는 부분 수정이며 하나 이상의 필드가 필요하다. 목적지 객체가
        포함되면 해당 후기 전용 destination snapshot을 새로 만들거나 안전하게
        교체하고 후기 갱신과 같은 트랜잭션으로 이전 snapshot을 정리한다. 다른
        후기와 공유하는 목적지 행을 직접 수정하지 않는다. 목적지 객체가 없으면
        기존 snapshot을 유지한다. `feltCommuteMin`은 생략하거나 null로 보내
        선택 입력을 지울 수 있다. 타인 후기의 수정은 403, 이미 삭제되었거나 없는
        후기는 404다.

        이 API의 camelCase↔D1 snake_case 매핑은 `Review` 응답과 동일하다.
        `destination.name`↔`destinations.place_name`, `createdAt`↔
        `reviews.created_at`, `updatedAt`↔`reviews.updated_at`도 serializer에서
        변환하며, 계산값 `helpfulCount`·`helpfulByMe`·`isMine`은 새 컬럼이 아니다.

        - 요구사항: `REQ-FUNC-014`, `REQ-NFN-003`
        - 화면: `SCR-RVW-002`
        - 저장소/테이블: D1 `sessions`, `reviews`, 필요 시 `destinations`
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpdate'
            example:
              feltCommuteMin: 39
              ratings: {safety: 5, price: 3, convenience: 5}
              body: 밤에도 골목이 밝고 출퇴근 동선이 단순해서 매우 만족했습니다.
      responses:
        '200':
          description: 본인 후기 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [reviews]
      summary: 본인 후기 삭제
      operationId: deleteReview
      security:
        - cookieAuth: []
      description: |
        세션 사용자와 후기 작성자가 일치할 때만 삭제한다. 후기와 연결된
        `review_helpfuls` 행과 후기별 destination snapshot은 후기 삭제 후 같은 D1
        트랜잭션에서 함께 정리한다. 외래키 cascade 또는 명시적 삭제 순서를 사용하되
        다른 후기의 목적지 snapshot은 건드리지 않는다. 타인 후기 삭제는 403이며,
        삭제된 후기나 존재하지 않는 ID는 404다.

        - 요구사항: `REQ-FUNC-014`, `REQ-NFN-003`
        - 화면: `SCR-RVW-002`
        - 저장소/테이블: D1 `sessions`, `reviews`, `review_helpfuls`, `destinations`;
          같은 트랜잭션에서 후기·도움돼요·해당 snapshot 정리
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '204':
          description: 후기와 연결된 도움돼요 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/reviews/{reviewId}/helpful:
    post:
      tags: [reviews]
      summary: 후기 도움돼요 등록
      operationId: addReviewHelpful
      security:
        - cookieAuth: []
      description: |
        로그인한 회원이 후기 하나에 한 번만 도움돼요를 등록한다. D1
        `review_helpfuls`의 복합 기본키 `(review_id, user_id)`가 중복을 막으며,
        이미 등록한 경우 409를 반환한다. 성공 응답은 최신 집계값을 반환한다.

        - 요구사항: `REQ-FUNC-015`, `REQ-NFN-003`
        - 화면: `SCR-RVW-001`
        - 저장소/테이블: D1 `sessions`, `reviews`, `review_helpfuls`
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '201':
          description: 도움돼요 등록 및 최신 집계 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpfulResult'
              example:
                reviewId: 101
                helpfulCount: 8
                helpfulByMe: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [reviews]
      summary: 후기 도움돼요 취소
      operationId: removeReviewHelpful
      security:
        - cookieAuth: []
      description: |
        로그인한 회원의 해당 후기 도움돼요를 취소한다. 취소 뒤 다시 집계한 최신
        `helpfulCount`와 현재 사용자의 `helpfulByMe: false`를 반환한다. 도움돼요가
        없어도 최종 상태를 일관되게 만들 수 있도록 200과 최신 집계값을 반환한다.

        - 요구사항: `REQ-FUNC-015`, `REQ-NFN-003`
        - 화면: `SCR-RVW-001`
        - 저장소/테이블: D1 `sessions`, `reviews`, `review_helpfuls`
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: 도움돼요 취소 및 최신 집계 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpfulResult'
              example:
                reviewId: 101
                helpfulCount: 7
                helpfulByMe: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: oneday_session
      description: HttpOnly·Secure·SameSite 세션 쿠키. 원문 세션 토큰은 응답 JSON이나 D1에 저장하지 않는다.

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: OAuth 제공자
      schema:
        type: string
        enum: [kakao, github]
      example: kakao
    RegionCode:
      name: code
      in: path
      required: true
      description: 행정동 법정 코드 10자리
      schema:
        type: string
        pattern: '^[0-9]{10}$'
        minLength: 10
        maxLength: 10
      example: "1111053000"
    ReviewId:
      name: reviewId
      in: path
      required: true
      description: 후기 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 101

  responses:
    BadRequest:
      description: 요청 형식·범위·필수값 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_REQUEST
            message: 입력값을 확인해 주세요.
    Unauthorized:
      description: 세션 쿠키가 없거나 만료되어 로그인이 필요함
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: 로그인이 필요합니다.
    Forbidden:
      description: 로그인했지만 리소스의 작성자가 아니어서 권한이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: 본인이 작성한 후기만 수정하거나 삭제할 수 있습니다.
    NotFound:
      description: 행정동 또는 후기가 존재하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: 요청한 리소스를 찾을 수 없습니다.
    Conflict:
      description: 동일 회원의 행정동 후기 또는 도움돼요가 이미 존재함
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            duplicateReview:
              value:
                code: REVIEW_DUPLICATED
                message: 이미 이 행정동에 후기를 작성하셨습니다.
            duplicateHelpful:
              value:
                code: HELPFUL_DUPLICATED
                message: 이미 도움돼요를 등록한 후기입니다.
    WorkerMethodNotAllowed:
      description: 현재 Worker가 해당 경로에서 GET만 지원함
      headers:
        Allow:
          description: 허용되는 HTTP method
          schema:
            type: string
          example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkerError'
          example:
            error: GET만 지원합니다
    WorkerServiceUnavailable:
      description: KV 데이터와 정적 데이터 번들을 모두 찾지 못함
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkerError'
          example:
            error: 데이터 번들을 찾을 수 없습니다.
    WorkerServerError:
      description: 서버 내부 예외 또는 외부 제공자·D1 처리 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkerError'
          example:
            error: 서버 내부 오류가 발생했습니다
    ServerError:
      description: 설계 API의 서버 내부 예외 또는 외부 제공자·D1 처리 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: 서버 내부 오류가 발생했습니다.

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 화면에서 분기할 수 있는 서버 오류 코드
          example: INVALID_REQUEST
        message:
          type: string
          description: 사용자에게 표시할 수 있는 한국어 오류 메시지
          example: 입력값을 확인해 주세요.
        details:
          type: object
          additionalProperties: true
          description: 선택적 필드별 오류 정보

    WorkerError:
      type: object
      required: [error]
      description: 현재 구현된 Worker가 /api/data·/api/geocode에서 반환하는 오류 본문
      properties:
        error:
          type: string
          example: GET만 지원합니다

    AuthUser:
      type: object
      required: [id, nickname]
      description: |
        OAuth UID에서 만든 익명 사용자 응답이다. `nickname`은 `users.nickname`과
        동일한 1~12자 범위로 검증한다. 이메일·실명·사진은 포함하지 않는다.
      properties:
        id:
          type: integer
          format: int64
          description: 서비스 내부 사용자 ID
          example: 42
        nickname:
          type: string
          minLength: 1
          maxLength: 12
          description: UID에서 만든 1~12자 익명 닉네임
          example: 익명_7F3A

    GeoResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/GeoResult'

    GeoResult:
      type: object
      required: [name, address, lat, lng, kind]
      properties:
        name:
          type: string
          example: 강남역
        address:
          type: string
          example: 서울 강남구 강남대로 396
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 37.497942
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 127.027621
        kind:
          type: string
          enum: [station, place]
          example: station

    DataBundle:
      type: object
      required: [meta, pctKeys, axisWeights, unavailableAxes, dongs, graph, bus, residential, scores]
      description: |
        `GET /api/data`가 내려주는 KV 번들(`bundle:current`)의 전체 구조다.
        브라우저는 이 번들 하나로 통근시간·등급·추천 정렬·상세 근거를 모두
        계산하며, 그래서 별도의 추천·통근 계산 API가 없다.

        **화면 표시값이 어느 필드에서 오는가**

        | 화면 | 표시값 | 출처 필드 |
        |---|---|---|
        | SCR-MAIN-001 | 지도 등급 색·아이콘 | `scores[code].safety/price/convenience` |
        | SCR-DONG-001 | 축 점수와 계산식 | `scores[code]` + `axisWeights` |
        | SCR-DONG-001 | "왜 이 등급인지" 원지표 | `scores[code].raw` |
        | SCR-DONG-001 | 지표별 백분위 | `scores[code].pct` (순서는 `pctKeys`) |
        | SCR-WGHT-001 | 주택유형·환산모드별 가격 | `scores[code].rentVariants` |
        | SCR-WGHT-001 | 통근시간·경로 | `graph`·`bus`·`residential`로 브라우저가 계산 |
        | 공통 | 출처·기준 시점 표기 | `meta` |

        **서버가 주는 값과 브라우저가 만드는 값의 구분**

        이 번들의 모든 필드는 파이프라인이 사전계산해 KV에 올린 *서버 제공값*이다.
        반면 통근시간, 사용자 가중치를 반영한 종합 점수, 등급(상위 30% Best /
        하위 30% Bad), 추천 정렬, 분포 통계(중앙값·동점 비율), 공유 URL 상태는
        번들에 없고 *브라우저가 매번 계산*한다.

        예외가 하나 있다. 백분위(`pct`, `rentVariants[].pct`)는 브라우저가
        가진 원지표로 다시 계산할 수 있지만 그렇게 하지 않고 파이프라인 값을
        그대로 쓴다. 동점 평균 순위 처리가 미세하게 어긋나면 화면에 노출하는
        계산식과 실제 축 점수가 안 맞기 때문이다.
      properties:
        meta:
          $ref: '#/components/schemas/BundleMeta'
        pctKeys:
          type: array
          description: "`DongScore.pct` 배열의 순서를 정하는 지표 키 목록. 현재 9개다."
          items:
            $ref: '#/components/schemas/MetricKey'
          example: [nightlifePerKm2, crimePer1k, trafficAccidentPerKm2, monthlyRentMan, storePerKm2, foodPerKm2, medicalPerKm2, walkToStationMin, busStopPerKm2]
        axisWeights:
          $ref: '#/components/schemas/AxisWeights'
        unavailableAxes:
          type: array
          description: 원지표가 전부 결측이라 점수를 낼 수 없는 축. 현재 번들은 빈 배열이다.
          items:
            type: string
            enum: [safety, price, convenience]
          example: []
        dongs:
          type: array
          description: 대상 행정동 메타데이터. 현재 556개이며 `scores`의 키 개수와 같다.
          items:
            $ref: '#/components/schemas/Dong'
        graph:
          $ref: '#/components/schemas/SubwayGraph'
        bus:
          $ref: '#/components/schemas/BusNetwork'
        residential:
          $ref: '#/components/schemas/ResidentialAccess'
        scores:
          type: object
          description: |
            행정동 코드를 키로 하는 맵이다. 키가 10자리 행정동 코드 556개로
            가변이라 값 타입만 고정한다.
          additionalProperties:
            $ref: '#/components/schemas/DongScore'

    MetricKey:
      type: string
      description: |
        원지표 키. `pctKeys`, `AxisWeight.key`, `DongRawMetrics`가 모두 같은
        이름을 쓴다. `cctvPerKm2`는 원 데이터셋이 폐기되어 현재 항상 null이며
        `meta.missingMetrics`에 들어간다.
      enum:
        - monthlyRentMan
        - nightlifePerKm2
        - cctvPerKm2
        - crimePer1k
        - trafficAccidentPerKm2
        - storePerKm2
        - foodPerKm2
        - medicalPerKm2
        - busStopPerKm2
        - walkToStationMin

    BundleMeta:
      type: object
      required: [boundaryVersion, graphVersion, busVersion, residentialVersion, scoreVersion, availableMetrics, missingMetrics]
      description: 데이터 출처별 기준 시점과 버전. 상세 패널의 출처 표기에 쓴다.
      properties:
        boundaryVersion:
          type: string
          description: 행정동 경계 기준일
          example: "20260701"
        graphVersion:
          type: string
          example: "2026-08-15"
        busVersion:
          type: string
          example: "2026-08-12"
        residentialVersion:
          type: string
          example: sgis-2024-100m-bus-v4
        scoreVersion:
          type: string
          example: "2026-08-18"
        rentPeriod:
          $ref: '#/components/schemas/RentPeriod'
        availableMetrics:
          type: array
          description: 실제로 수집되어 축 점수에 반영된 지표. 현재 9개다.
          items:
            $ref: '#/components/schemas/MetricKey'
        missingMetrics:
          type: array
          description: 수집 불가로 점수에서 빠진 지표. 현재 `cctvPerKm2` 하나다.
          items:
            $ref: '#/components/schemas/MetricKey'
          example: [cctvPerKm2]

    RentPeriod:
      type: object
      description: 월세 중앙값을 낸 실거래 표본의 범위와 정제 내역.
      properties:
        startDate:
          type: string
          example: "20230101"
        endDate:
          type: string
          example: "20251231"
        contractType:
          type: string
          example: 신규
        defaultTypes:
          type: array
          description: "`raw.monthlyRentMan`을 만든 기본 주택유형 조합"
          items:
            $ref: '#/components/schemas/RentHousingType'
          example: [house, officetel, apartment]
        seoul:
          type: object
          description: 서울 표본 집계. 원본 중복 행과 공공임대를 제거한 수를 함께 남긴다.
          additionalProperties: true
          example:
            source: 서울 열린데이터광장 부동산 전월세가 파일
            records: 516349
            duplicatesRemoved: 150582
            publicRentalRemoved: 2827
        gyeonggi:
          type: object
          description: 경기 표본 집계
          additionalProperties: true
          example:
            source: 국토교통부 전월세 실거래가 API
            records: 122841
            publicRentalRemoved: 7724

    AxisWeights:
      type: object
      required: [safety, price, convenience]
      description: |
        축별 하위 지표와 그 가중치다. 결측 지표를 뺀 뒤 합이 1이 되도록
        재정규화한 값이라, 상세 패널의 계산식을 이 배열 그대로 보여줄 수 있다.
      properties:
        safety:
          type: array
          items:
            $ref: '#/components/schemas/AxisWeight'
        price:
          type: array
          items:
            $ref: '#/components/schemas/AxisWeight'
        convenience:
          type: array
          items:
            $ref: '#/components/schemas/AxisWeight'
      example:
        safety:
          - {key: nightlifePerKm2, label: 유흥업소 밀도, dir: -1, w: 0.3846153846153846}
          - {key: crimePer1k, label: 5대범죄, dir: -1, w: 0.4615384615384615}
          - {key: trafficAccidentPerKm2, label: 교통사고 다발지역, dir: -1, w: 0.15384615384615385}
        price:
          - {key: monthlyRentMan, label: 환산월세, dir: -1, w: 1}
        convenience:
          - {key: storePerKm2, label: 편의점·마트 밀도, dir: 1, w: 0.3}
          - {key: foodPerKm2, label: 음식점 밀도, dir: 1, w: 0.25}
          - {key: medicalPerKm2, label: 병원·약국 밀도, dir: 1, w: 0.2}
          - {key: walkToStationMin, label: 최근접역 도보, dir: -1, w: 0.175}
          - {key: busStopPerKm2, label: 버스 정류장 밀도, dir: 1, w: 0.075}

    AxisWeight:
      type: object
      required: [key, label, dir, w]
      properties:
        key:
          $ref: '#/components/schemas/MetricKey'
        label:
          type: string
          description: 상세 패널에 그대로 노출하는 지표명
          example: 유흥업소 밀도
        dir:
          type: integer
          description: +1이면 값이 클수록 좋고, -1이면 클수록 나쁘다.
          enum: [1, -1]
          example: -1
        w:
          type: number
          format: double
          description: 축 안에서의 가중치. 같은 축의 합이 1이다.
          example: 0.3846153846153846

    DongScore:
      type: object
      required: [safety, price, convenience, pct, raw, dataQuality]
      description: |
        행정동 하나의 평판 점수다. 세 축 점수는 대상 556개 동 안에서의
        백분위(0~100)이며, 후기의 평점·본문은 여기에 전혀 반영하지 않는다.
      properties:
        safety:
          type: number
          format: double
          description: 치안 축 점수 0~100
          example: 36.5
        price:
          type: number
          format: double
          description: 가격 축 점수 0~100
          example: 41.5
        convenience:
          type: number
          format: double
          description: 생활편의 축 점수 0~100
          example: 16.9
        pct:
          type: array
          description: |
            지표별 백분위. 배열 순서는 번들의 `pctKeys`가 정하고, 결측이면
            null이다. 축 점수만으로는 "치안 36.5"가 어디서 왔는지 설명할 수
            없어 상세 패널이 이 배열로 계산을 되짚는다.
          items:
            type: number
            format: double
            nullable: true
          example: [56.2, 31.4, 78.0, 21.6, 44.1, 92.3, 60.5, 12.8, 70.2]
        raw:
          $ref: '#/components/schemas/DongRawMetrics'
        dataQuality:
          type: string
          description: 표본이 부족해 자치구 중앙값 등 대체값을 쓴 경우 `low`다.
          enum: [ok, low]
          example: low
        rentVariants:
          $ref: '#/components/schemas/RentVariants'

    DongRawMetrics:
      type: object
      description: |
        상세 패널이 "왜 이 등급인지" 근거로 보여주는 실제 수치다. 수집하지
        못한 지표는 0이 아니라 null이다 — 0으로 두면 "사고 0건"처럼 가장 좋은
        값으로 읽혀 조용히 틀린다.
      required: [monthlyRentMan, rentSamples, rentByType, cctvPerKm2, nightlifePerKm2, crimePer1k, trafficAccidentPerKm2, storePerKm2, foodPerKm2, medicalPerKm2, busStopPerKm2, walkToStationMin]
      properties:
        monthlyRentMan:
          type: number
          format: double
          nullable: true
          description: 환산월세 중앙값(만원)
          example: 67.76
        rentSamples:
          type: integer
          description: 실거래 표본 수
          example: 0
        rentByType:
          allOf:
            - $ref: '#/components/schemas/RentByType'
          nullable: true
        cctvPerKm2:
          type: number
          format: double
          nullable: true
          description: CCTV 밀도(대/km²). 원 데이터셋이 폐기되어 현재 항상 null이다.
          example: null
        nightlifePerKm2:
          type: number
          format: double
          nullable: true
          description: 일반·무도 유흥주점 밀도(개/km²)
          example: 0.82
        crimePer1k:
          type: number
          format: double
          nullable: true
          description: 자치구 5대범죄 발생(건/천명). 경찰서 단위라 구 해상도가 한계다.
          example: 20.27
        trafficAccidentPerKm2:
          type: number
          format: double
          nullable: true
          description: 교통사고 다발지점 사고건수 밀도(건/km²)
          example: 2.05
        storePerKm2:
          type: number
          format: double
          nullable: true
          description: 편의점·마트 밀도(개/km²)
          example: 9.44
        foodPerKm2:
          type: number
          format: double
          nullable: true
          description: 음식점 밀도(개/km²). 주점(I211)은 제외한다.
          example: 96.45
        medicalPerKm2:
          type: number
          format: double
          nullable: true
          description: 병원·약국 밀도(개/km²)
          example: 4.93
        busStopPerKm2:
          type: number
          format: double
          nullable: true
          description: 버스 정류장 밀도(개/km²). 노선 다양성이 아니라 정류장 수다.
          example: 9.85
        walkToStationMin:
          type: number
          format: double
          nullable: true
          description: 100m 거주인구 분포 기준 최근접 지하철역까지 도보시간 중앙값(분)
          example: 11.2

    RentHousingType:
      type: string
      description: 주택유형. house는 단독·다가구, apartment는 소형아파트(10~60㎡)다.
      enum: [house, rowhouse, officetel, apartment]

    RentTypeStat:
      type: object
      required: [medianMan, samples]
      properties:
        medianMan:
          type: number
          format: double
          nullable: true
          example: 60.05
        samples:
          type: integer
          example: 3923

    RentByType:
      type: object
      required: [house, rowhouse, officetel, apartment]
      description: 네 주택유형별 월세 분해. 상세 패널 표시용이다.
      properties:
        house:
          $ref: '#/components/schemas/RentTypeStat'
        rowhouse:
          $ref: '#/components/schemas/RentTypeStat'
        officetel:
          $ref: '#/components/schemas/RentTypeStat'
        apartment:
          $ref: '#/components/schemas/RentTypeStat'

    RentVariantStat:
      type: object
      required: [medianMan, samples, pct]
      properties:
        medianMan:
          type: number
          format: double
          nullable: true
          example: 60.05
        samples:
          type: integer
          example: 0
        pct:
          type: number
          format: double
          nullable: true
          description: |
            이 조합·모드 안에서의 556개 동 기준 백분위(0~100). 월세가 낮을수록
            높다. 파이프라인이 계산한 값이며 클라이언트가 다시 계산하지 않는다.
          example: 21.6

    RentVariants:
      type: object
      required: [converted, raw]
      description: |
        주택유형 조합 15개(공집합을 뺀 부분집합) × 환산모드 2개를 사전계산해
        둔 것이다. 사용자가 SCR-WGHT-001에서 유형을 고르면 클라이언트 재계산
        없이 여기서 바로 조회한다.

        키는 house, rowhouse, officetel, apartment 순으로 정렬해 `+`로 이은
        문자열이다(예: `house`, `house+officetel`, `house+officetel+apartment`).
        화면 기본값은 `converted`의 `house`이다.
      properties:
        converted:
          type: object
          description: 보증금을 월세로 환산해 더한 값. 전월세전환율은 유형·지역별 실측값을 쓴다.
          additionalProperties:
            $ref: '#/components/schemas/RentVariantStat'
        raw:
          type: object
          description: 보증금 환산 없는 순수 월세.
          additionalProperties:
            $ref: '#/components/schemas/RentVariantStat'

    SubwayGraph:
      type: object
      required: [version, generatedAt, stations, nodes, edges]
      description: |
        브라우저 통근 계산에 쓰는 지하철 그래프다. 노드는 "역"이 아니라
        "(역, 노선)" 쌍이라, 강남역은 2호선 노드와 신분당선 노드로 나뉘고 둘
        사이를 환승 엣지가 잇는다. 이렇게 해야 환승 비용이 경로에 자연히
        반영된다.
      properties:
        version:
          type: string
          example: "2026-08-15"
        generatedAt:
          type: string
          format: date-time
        source:
          type: string
          example: OpenStreetMap (ODbL) via Overpass API
        note:
          type: string
          example: 역간 소요시간은 역간 직선거리 × 1.04 ÷ 노선별 표정속도로 추정한 값이다.
        stations:
          type: array
          description: 물리적 역. 좌표 기반 최근접 탐색이 이쪽을 쓴다. 현재 624개다.
          items:
            $ref: '#/components/schemas/Station'
        nodes:
          type: array
          description: (역, 노선) 노드. 그래프 탐색이 이쪽을 쓴다.
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          description: 인접 리스트. `edges[nodeId]`가 그 노드에서 나가는 엣지들이다.
          items:
            type: array
            items:
              $ref: '#/components/schemas/Edge'

    Station:
      type: object
      required: [id, name, lat, lng, nodeIds, lines]
      properties:
        id:
          type: integer
          example: 0
        name:
          type: string
          example: 성신여대입구
        lat:
          type: number
          format: double
          example: 37.592615
        lng:
          type: number
          format: double
          example: 127.016459
        nodeIds:
          type: array
          description: 이 역에 속한 노드 id. 환승역이면 여러 개다.
          items:
            type: integer
          example: [104, 500]
        lines:
          type: array
          items:
            type: string
          example: ["4", "W"]

    GraphNode:
      type: object
      required: [id, stationId, line]
      properties:
        id:
          type: integer
          example: 0
        stationId:
          type: integer
          example: 21
        line:
          type: string
          example: "3"

    Edge:
      type: object
      required: [to, min, kind, source]
      properties:
        to:
          type: integer
          description: 도착 노드 id
          example: 1
        min:
          type: number
          format: double
          description: 소요시간(분). 환승 도보는 상수 2분이다.
          example: 2.31
        kind:
          type: string
          enum: [ride, transfer]
          example: ride
        source:
          type: string
          description: |
            measured는 공공데이터 실측값, estimated는 거리 기반 추정값이다.
            현재 파이프라인은 estimated만 만든다.
          enum: [measured, estimated]
          example: estimated

    BusNetwork:
      type: object
      required: [version, generatedAt, defaultHeadwayMin, sources, stops, routes]
      description: |
        정적 버스망이다. 원천의 긴 필드명을 튜플로 접어 KV 번들 크기를 줄였다.
        노선의 정류장 배열은 운행 방향 순서이며 역방향 이동은 허용하지 않는다.
        통근 계산에서 첫·마지막 무환승 접근에만 쓰고, 전체 노선을 지도에
        그리지는 않는다.
      properties:
        version:
          oneOf:
            - type: string
            - type: integer
          example: 1
        generatedAt:
          type: string
          format: date-time
        defaultHeadwayMin:
          type: number
          format: double
          description: 배차간격이 없는 노선에 쓰는 기본값(분)
          example: 15
        sources:
          type: object
          description: 원천 데이터와 거리 추정 모델의 파라미터
          additionalProperties: true
        stops:
          type: array
          description: |
            정류장 목록. 배열 인덱스가 곧 정류장 id다. 현재 41,423개다.
          items:
            type: array
            description: "[정류장명, 위도, 경도]"
            minItems: 3
            maxItems: 3
            items:
              oneOf:
                - type: string
                - type: number
                  format: double
          example: [수월암리공단, 37.118583, 127.0248]
        routes:
          type: array
          description: |
            노선 목록. 배열 인덱스가 곧 노선 id다. 현재 2,943개다.
            각 원소는 [노선명, 평일 배차간격(분), 정류장 id 순서, 누적 운행거리(m)]다.
          items:
            type: array
            minItems: 4
            maxItems: 4
            items: {}

    ResidentialAccess:
      type: object
      required: [version, generatedAt, resolutionM, percentile, byDong]
      description: |
        100m 거주인구 격자를 좌표 없이 접근 선택지 묶음으로 압축한 프로필이다.
        통근시간을 동 대표점 하나가 아니라 실제 사람이 사는 분포로 계산하려고
        둔다. 공개 번들에는 **거주 좌표를 전혀 넣지 않고** 동별 최대 24개
        대표 생활권의 정규화 가중치와 역 접근 선택지만 담는다.
      properties:
        version:
          type: string
          example: sgis-2024-100m-bus-v4
        source:
          type: string
          description: 공개 산출물에서 분리되어도 유지해야 하는 필수 출처표시
          example: 국가데이터처 통계지리정보서비스(SGIS), 2024년 인구 100m 격자
        busVersion:
          oneOf:
            - type: string
            - type: integer
          description: 인덱스 기반 busRef를 만들 때 사용한 버스망 버전
        generatedAt:
          type: string
          format: date-time
        resolutionM:
          type: integer
          example: 100
        percentile:
          type: number
          format: double
          description: 동별 대표 통근시간을 뽑을 때 쓰는 분위수
          example: 0.5
        weightScale:
          type: number
          format: double
          description: 원 인구수 대신 동마다 합을 같게 만든 정규화 가중치 눈금
          example: 10000
        maxProfilesPerDong:
          type: integer
          description: 원 100m 셀을 그대로 노출하지 않기 위한 동별 대표 프로필 상한
          example: 24
        byDong:
          type: object
          description: |
            행정동 코드를 키로 하는 맵이다. 값은 프로필 배열이고, 프로필 하나는
            [동별 정규화 가중치, 역 접근 선택지 목록]이다. 접근 선택지 하나는
            [역 id, 실제 접근시간(분), 역 선택용 비용, 0=도보/1=버스, busRef?]이고
            busRef는 [버스 노선 id, 승차 순번, 하차 순번, 승차 정류장까지 도보(분)]다.

            "실제 접근시간"과 "역 선택용 비용"이 나뉘어 있는 이유: 어느 역에서
            탈지 고를 때만 도보 1분을 1.4분으로 환산해 비교하고, 화면에 표시하는
            소요시간은 항상 가중치 없는 실측값을 쓴다.
          additionalProperties:
            type: array
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: {}

    Dong:
      type: object
      required: [code, name, dong, gu, guCode, areaKm2, lng, lat]
      properties:
        code:
          type: string
          example: "1111053000"
        name:
          type: string
          example: 종로구 사직동
        dong:
          type: string
          example: 사직동
        gu:
          type: string
          example: 종로구
        guCode:
          type: string
          example: "11110"
        areaKm2:
          type: number
          format: double
          example: 1.1649
        lng:
          type: number
          format: double
          example: 126.970011
        lat:
          type: number
          format: double
          example: 37.573854

    ReviewPage:
      type: object
      required: [page, pageSize, totalCount, hasNext, items]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        totalCount:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'

    Review:
      type: object
      description: |
        후기 응답의 API camelCase와 D1 snake_case 매핑은 다음과 같다:
        `residenceMonths`↔`reviews.residence_months`, `feltCommuteMin`↔
        `reviews.felt_commute_min`, `createdAt`↔`reviews.created_at`,
        `updatedAt`↔`reviews.updated_at`, `destination.name`↔
        `destinations.place_name`, `ratings.safety|price|convenience`↔
        `reviews.rating_safety|rating_price|rating_convenience`. `helpfulCount`는
        `COUNT(review_helpfuls.review_id)`, `helpfulByMe`는 현재 세션 사용자와
        `review_helpfuls`의 `(review_id,user_id)` 존재 여부, `isMine`은 현재 세션
        사용자와 `reviews.user_id`의 일치 여부로 계산하는 값이며 새 DB 컬럼이 아니다.
      required:
        - id
        - nickname
        - residenceMonths
        - destination
        - feltCommuteMin
        - ratings
        - body
        - helpfulCount
        - helpfulByMe
        - isMine
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          example: 101
        nickname:
          type: string
          minLength: 1
          maxLength: 12
          description: 이메일·실명 대신 표시하는 1~12자 익명 닉네임
          example: 익명_7F3A
        residenceMonths:
          type: integer
          minimum: 1
          maximum: 600
          example: 18
        destination:
          $ref: '#/components/schemas/ReviewDestination'
        feltCommuteMin:
          type: integer
          nullable: true
          minimum: 0
          maximum: 240
          description: 작성자가 체감한 통근 시간(분). 미입력은 null
          example: 42
        ratings:
          $ref: '#/components/schemas/ReviewRatings'
        body:
          type: string
          minLength: 20
          maxLength: 1000
          example: 밤에도 골목이 밝고 출퇴근 동선이 단순해서 만족했습니다.
        helpfulCount:
          type: integer
          minimum: 0
          description: "`review_helpfuls.review_id`의 COUNT로 계산하는 응답값"
          example: 7
        helpfulByMe:
          type: boolean
          description: 현재 세션 사용자와 `review_helpfuls`의 반응 존재 여부로 계산하는 응답값. 비로그인은 false
          example: false
        isMine:
          type: boolean
          description: 현재 세션 사용자와 `reviews.user_id`의 일치 여부로 계산하는 응답값. 비로그인은 false
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReviewCreate:
      type: object
      additionalProperties: false
      description: |
        신규 후기는 반드시 null이 아닌 `destination` 객체를 포함한다. 목적지의
        `name`은 D1 `destinations.place_name`에 저장하며, `residenceMonths`와
        ratings/body는 D1의 snake_case 컬럼으로 매핑한다. `feltCommuteMin`만
        선택 입력이므로 키를 생략하거나 null을 보낼 수 있다.
      required: [residenceMonths, destination, ratings, body]
      properties:
        residenceMonths:
          type: integer
          minimum: 1
          maximum: 600
          description: 거주 기간(개월)
        destination:
          $ref: '#/components/schemas/ReviewDestinationInput'
        feltCommuteMin:
          type: integer
          nullable: true
          minimum: 0
          maximum: 240
          description: 체감 통근시간(분). 선택 입력이며 키를 생략하거나 null을 보낼 수 있다.
        ratings:
          $ref: '#/components/schemas/ReviewRatings'
        body:
          type: string
          minLength: 20
          maxLength: 1000
          description: 실거주 후기 본문

    ReviewUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        부분 수정 요청이다. `feltCommuteMin`은 유일한 선택 입력으로 키를 생략하거나
        null로 보내 기존 값을 지울 수 있다. `destination`이 있으면 null이 아닌
        후기 전용 snapshot 객체이며, `destination.name`은
        `destinations.place_name`으로 매핑한다.
      properties:
        residenceMonths:
          type: integer
          minimum: 1
          maximum: 600
        destination:
          $ref: '#/components/schemas/ReviewDestinationInput'
        feltCommuteMin:
          type: integer
          nullable: true
          minimum: 0
          maximum: 240
          description: 선택 입력. 키를 생략하거나 null을 보내 기존 체감 통근시간을 지운다.
        ratings:
          $ref: '#/components/schemas/ReviewRatings'
        body:
          type: string
          minLength: 20
          maxLength: 1000

    ReviewDestinationInput:
      type: object
      additionalProperties: false
      required: [name, address, lat, lng]
      description: |
        후기별로 저장하는 목적지 snapshot 입력이다. `name`은 D1
        `destinations.place_name`으로 매핑하며, 일반 지오코딩 KV 캐시와 공유하지
        않는다. 이 객체는 후기 생성·교체 시 null일 수 없다.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: 강남역
        address:
          type: string
          minLength: 1
          maxLength: 300
          example: 서울 강남구 강남대로 396
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 37.497942
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 127.027621

    ReviewDestination:
      allOf:
        - $ref: '#/components/schemas/ReviewDestinationInput'

    ReviewRatings:
      type: object
      additionalProperties: false
      required: [safety, price, convenience]
      description: |
        API 중첩 키는 D1 snake_case 컬럼으로 변환한다:
        `safety`↔`reviews.rating_safety`, `price`↔`reviews.rating_price`,
        `convenience`↔`reviews.rating_convenience`.
      properties:
        safety:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        price:
          type: integer
          minimum: 1
          maximum: 5
          example: 3
        convenience:
          type: integer
          minimum: 1
          maximum: 5
          example: 5

    HelpfulResult:
      type: object
      required: [reviewId, helpfulCount, helpfulByMe]
      properties:
        reviewId:
          type: integer
          format: int64
          example: 101
        helpfulCount:
          type: integer
          minimum: 0
          description: 변경 직후 다시 집계한 도움돼요 수
          example: 8
        helpfulByMe:
          type: boolean
          description: 현재 세션 사용자의 최신 반응 상태
          example: true
