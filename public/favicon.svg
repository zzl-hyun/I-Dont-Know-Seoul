<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    등급 분포를 그대로 그린 고리.

    이 서비스가 하는 일은 서울 427개 동을 상대 평가로 갈라 칠하는 것이고,
    컷이 상위 30% Best · 하위 30% Bad 다. 고리를 30/40/30 으로 나눈 게
    그 분포다 — 장식이 아니라 제품 그 자체다.

    16px 로 줄어들면 세 색이 섞인 원으로만 읽히는데, 그래도 "초록·노랑·빨강"
    이라는 이 앱의 신호는 남는다. 글자나 집 모양을 넣으면 그 크기에서
    뭉개져서 아무것도 안 남는다.

    둘레 = 2 * pi * 16 = 100.53 이라 백분율이 그대로 길이가 된다.
    각 조각은 양옆으로 1 씩 띄워 경계를 만든다.
  -->
  <rect width="64" height="64" rx="14" fill="#16181d" />
  <g fill="none" stroke-width="10" transform="rotate(-90 32 32)">
    <circle cx="32" cy="32" r="16" stroke="#2e9e5b"
            stroke-dasharray="28.2 72.33" stroke-dashoffset="0" />
    <circle cx="32" cy="32" r="16" stroke="#e0a52b"
            stroke-dasharray="38.2 62.33" stroke-dashoffset="-30.16" />
    <circle cx="32" cy="32" r="16" stroke="#c2504a"
            stroke-dasharray="28.2 72.33" stroke-dashoffset="-70.37" />
  </g>
</svg>
